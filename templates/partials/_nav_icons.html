{% comment %}
  رموز الشريط الجانبي — لوحة محلية واحدة، تُدرَج مرة داخل `<nav>` ويشير إليها
  كل مدخل بـ `<use>`. لا CDN ولا خطّ رموز ولا حزمة: أربعون رمزاً هنا أرخص من
  أربعين ملفاً، ويُطبَع منها التعريف مرة لا مرة لكل مدخل.

  لغة واحدة لكل الرموز: `viewBox 0 0 20 20`، خطوط بلا تعبئة، وسماكة وأطراف
  مضبوطة على `<svg>` الحاوي في `_nav.html` — فمكانٌ واحد يحكم الشكل كله.

  الاتجاه: الأشكال هندسية لا حرفية، والسهم في «الاستردادات» و«النقل» يدلّ على
  الفعل لا على جهة القراءة، فلا ينقلب مع RTL ولا يحتاج نسخة ثانية.
{% endcomment %}
