{% load i18n %}
{% comment %}Shared chrome for every report: filters, export, print.{% endcomment %}
<div class="no-print">
  <div class="toolbar">
    <a class="btn2" href="{% url 'reporting:reports' %}">{% translate "كل التقارير" %}</a>
    <span class="spacer"></span>
    {% if exportable %}
      <a class="btn2" href="{% url 'reporting:report-export' report.number %}?from={{ date_from }}&to={{ date_to }}">{% translate "تصدير CSV" %}</a>
    {% endif %}
    <button class="btn2 primary" onclick="window.print()">{% translate "طباعة" %}</button>
  </div>
  <form method="get" class="filterbar" role="search">
    <div class="fld">
      <label for="f_from">{% translate "من تاريخ" %}</label>
      <input type="date" name="from" value="{{ date_from }}" id="f_from">
    </div>

    <div class="fld">
      <label for="f_to">{% translate "إلى تاريخ" %}</label>
      <input type="date" name="to" value="{{ date_to }}" id="f_to">
    </div>
    <button class="btn2" type="submit">{% translate "تطبيق" %}</button>
  </form>
</div>
<h1>{{ report.title }}</h1>
